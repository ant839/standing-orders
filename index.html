<style>
  :root{
    --bg:#1d1f18;
    --panel:#262820;
    --panel-2:#2e3027;
    --panel-3:#383a2e;
    --line:#4a4c3c;
    --line-soft:#34362a;
    --bone:#f5f2e8;
    --bone-dim:#cdc8b4;
    --bone-faint:#948f78;
    --orange:#e2661c;
    --olive:#8a9a66;
    --yellow:#e8c23c;
    --stamp-red:#c14d40;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--bone);
    font-family:'IBM Plex Sans',sans-serif; height:100%; overflow:hidden;}
  .display{font-family:'Oswald',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  #app{display:flex; flex-direction:column; height:100vh; height:100dvh;}

  /* ---------- HEADER ---------- */
  header{
    flex:0 0 auto;
    background:var(--panel);
    border-bottom:2px solid var(--line);
    padding:14px 14px 10px;
    position:relative;
  }
  .doc-num{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:1.5px; color:var(--orange); margin-bottom:3px; font-weight:600;}
  h1{
    font-family:'Oswald',sans-serif; font-weight:700; font-size:24px; letter-spacing:.5px;
    margin:0; color:var(--bone); text-transform:uppercase;
  }
  .subtitle{font-size:11px; letter-spacing:.5px; color:var(--bone-dim); margin-top:2px;
    padding-bottom:10px; border-bottom:1px solid var(--line-soft); margin-bottom:10px;}

  .mission-row{display:flex; gap:8px; margin-bottom:10px;}
  .week-title-box{
    flex:1; text-align:left; background:var(--panel-2); border:1px solid var(--line);
    border-radius:6px; padding:7px 10px; display:flex; flex-direction:column; gap:1px;
  }
  .week-title-box:active{border-color:var(--orange);}
  .wt-lbl{font-family:'IBM Plex Mono',monospace; font-size:8px; letter-spacing:1.5px; color:var(--bone-faint); font-weight:600;}
  .wt-text{font-family:'Oswald',sans-serif; font-weight:600; font-size:14px; letter-spacing:.3px; color:var(--bone); text-transform:uppercase;}
  .countdown-box{
    background:var(--orange); border-radius:6px; padding:6px 12px; text-align:center;
    display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:76px;
  }
  .cd-num{font-family:'Oswald',sans-serif; font-weight:700; font-size:20px; line-height:1; color:#211205;}
  .cd-lbl{font-family:'IBM Plex Mono',monospace; font-size:7px; letter-spacing:.5px; color:#3a2107; font-weight:600; line-height:1.25; margin-top:2px;}

  .nav-row{display:flex; align-items:center; gap:8px;}
  .nav-btn{
    background:var(--panel-2); border:1px solid var(--line); color:var(--bone);
    width:34px; height:34px; border-radius:6px; font-size:16px; font-weight:600;
    display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .nav-btn:active{background:var(--panel-3); border-color:var(--orange); color:var(--orange);}
  .range-label{
    flex:1; text-align:center; font-family:'Oswald',sans-serif; font-weight:600;
    font-size:16px; letter-spacing:.5px; color:var(--orange);
  }
  .range-label .lbl{font-family:'IBM Plex Mono',monospace; font-size:8.5px; letter-spacing:2px;
    color:var(--bone-faint); display:block; font-weight:600; margin-bottom:1px;}
  .today-btn{
    background:transparent; border:1px solid var(--line); color:var(--bone-dim);
    font-size:10px; letter-spacing:1px; padding:0 10px; height:34px; border-radius:6px;
    font-weight:600; flex:0 0 auto;
  }
  .today-btn:active{border-color:var(--orange); color:var(--orange);}

  .view-toggle{display:flex; gap:6px; margin-top:10px;}
  .view-btn{
    flex:1; background:var(--panel-2); border:1px solid var(--line); color:var(--bone-dim);
    padding:8px 0; font-size:11px; letter-spacing:1px; border-radius:6px; font-weight:600;
  }
  .view-btn.active{background:var(--orange); color:#211205; border-color:var(--orange); font-weight:700;}

  /* ---------- LEGEND ---------- */
  .legend{display:flex; gap:16px; margin-top:10px;}
  .legend-item{display:flex; align-items:center; gap:6px; font-size:10.5px; color:var(--bone-dim); font-weight:500;}
  .legend-dot{width:9px; height:9px; border-radius:3px;}
  .legend-dot.sc{background:var(--olive);}
  .legend-dot.bjj{background:var(--yellow);}

  /* ---------- BOARD ---------- */
  #board{
    flex:1; overflow-x:auto; overflow-y:hidden; display:flex;
    scroll-snap-type:x proximity;
    -webkit-overflow-scrolling:touch;
  }
  .day-col{
    flex:0 0 auto; display:flex; flex-direction:column; height:100%;
    border-right:1px solid var(--line-soft); scroll-snap-align:start;
    background:var(--bg); position:relative;
  }
  .day-col.mode-1{width:100%;}
  .day-col.mode-7{width:155px;}

  .day-head{
    flex:0 0 auto; padding:10px 8px 8px; text-align:center;
    border-bottom:2px solid var(--line); position:relative;
    background:var(--panel);
  }
  .day-col.is-today .day-head{background:var(--panel-3);}
  .today-tab{
    position:absolute; top:-1px; left:0; right:0; height:3px; background:var(--orange);
  }
  .today-label{font-family:'IBM Plex Mono',monospace; font-size:8px; letter-spacing:1.5px; color:var(--orange); font-weight:600; margin-top:2px;}
  .day-head .dow{font-size:10.5px; letter-spacing:1.5px; color:var(--bone-faint); font-weight:600;}
  .day-col.is-today .day-head .dow{color:var(--orange);}
  .day-head .dnum{
    font-family:'Oswald',sans-serif; font-weight:700; font-size:24px; line-height:1.1;
    color:var(--bone);
  }
  .day-col.is-today .day-head .dnum{color:var(--orange);}
  .day-head .mon{font-size:9px; letter-spacing:1px; color:var(--bone-faint); font-weight:500;}

  .sections{flex:1; display:flex; flex-direction:column; overflow:hidden;}
  .section{flex:1; display:flex; flex-direction:column; overflow:hidden; min-height:0;}
  .section-head{
    flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
    padding:7px 8px; font-size:9.5px; letter-spacing:1px; text-transform:uppercase;
    color:var(--bone-dim); font-weight:600; border-bottom:1px solid var(--line-soft);
  }
  .section.sc .section-head{border-left:4px solid var(--olive);}
  .section.bjj .section-head{border-left:4px solid var(--yellow); border-top:1px solid var(--line-soft);}
  .add-mini{
    background:none; border:1px solid var(--line); color:var(--bone-dim);
    width:19px; height:19px; border-radius:5px; font-size:13px; line-height:1; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .add-mini:active{border-color:var(--orange); color:var(--orange);}

  .card-list{flex:1; overflow-y:auto; padding:6px; display:flex; flex-direction:column; gap:6px;}
  .card{
    background:var(--panel-2); border:1px solid var(--line-soft); border-radius:6px;
    padding:8px 9px; position:relative; border-left-width:4px; cursor:pointer;
  }
  .card:active{background:var(--panel-3);}
  .section.sc .card{border-left-color:var(--olive);}
  .section.bjj .card{border-left-color:var(--yellow);}
  .card .ctime{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--orange); font-weight:600;}
  .card .ctitle{
    font-family:'IBM Plex Sans',sans-serif; font-weight:600; font-size:14.5px;
    color:var(--bone); margin-top:2px; line-height:1.25;
  }
  .card .cloc{font-size:10.5px; color:var(--bone-dim); margin-top:2px;}
  .card .exlist{margin-top:6px; padding-top:6px; border-top:1px dashed var(--line-soft);}
  .card .exlist .exrow{font-size:10.5px; color:var(--bone-dim); line-height:1.5; display:flex; gap:5px;}
  .card .exlist .exrow .exname{color:var(--bone); font-weight:500;}
  .card .exlist .exactual{font-size:10.5px; color:var(--olive); line-height:1.4; padding-left:10px; font-weight:600;}
  .card-top-row{display:flex; align-items:flex-start; justify-content:space-between; gap:6px; margin-bottom:1px;}
  .card-icons{display:flex; align-items:center; gap:4px; flex:0 0 auto;}
  .stamp{
    background:var(--orange); color:#211205;
    font-family:'IBM Plex Mono',monospace; font-size:7px; font-weight:700; letter-spacing:.5px;
    padding:2px 5px; border-radius:3px; text-transform:uppercase; white-space:nowrap;
  }
  .logged-dot{
    background:var(--olive); color:#0f1208; width:15px; height:15px; border-radius:50%;
    font-size:9px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .card-edit-btn{
    background:none; border:1px solid var(--line); color:var(--bone-faint);
    width:19px; height:19px; border-radius:5px; font-size:11px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
  }
  .card-edit-btn:active{border-color:var(--orange); color:var(--orange);}
  .card .logstats{
    margin-top:6px; padding-top:6px; border-top:1px dashed var(--line-soft);
    font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--olive); font-weight:600;
    letter-spacing:.3px;
  }
  .empty-hint{font-size:10px; color:var(--bone-faint); text-align:center; padding:12px 4px;}

  /* ---------- MODAL ---------- */
  #overlay, #titleOverlay, #logOverlay{
    position:fixed; inset:0; background:rgba(10,10,6,.75); display:none;
    align-items:flex-end; z-index:50;
  }
  #overlay.open, #titleOverlay.open, #logOverlay.open{display:flex;}
  #sheet, #titleSheet, #logSheet{
    width:100%; background:var(--panel); border-top:2px solid var(--orange);
    border-radius:14px 14px 0 0; padding:16px 16px 22px; max-height:88vh; overflow-y:auto;
  }
  .sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;
    border-bottom:1px solid var(--line-soft); padding-bottom:10px;}
  .sheet-title{font-family:'Oswald',sans-serif; font-weight:600; font-size:18px; color:var(--bone);}
  .sheet-close{background:none; border:1px solid var(--line); color:var(--bone-dim); font-size:16px; width:28px; height:28px; border-radius:6px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:10px; letter-spacing:.5px; color:var(--bone-dim);
    text-transform:uppercase; margin-bottom:5px; font-weight:600;}
  .field input, .field select{
    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--bone);
    padding:10px; border-radius:6px; font-family:'IBM Plex Sans',sans-serif; font-size:14.5px;
  }
  .field input:focus, .field select:focus{outline:none; border-color:var(--orange);}
  .row2{display:flex; gap:10px;}
  .row2 .field{flex:1;}
  .color-row{display:flex; gap:10px; margin-top:2px;}
  .color-swatch{
    width:30px; height:30px; border-radius:50%; border:2px solid transparent; flex:0 0 auto;
  }
  .color-swatch.sel{border-color:var(--bone);}
  .repeat-row{display:flex; align-items:center; gap:8px; margin-bottom:14px;}

</style>

<script>
window.addEventListener('error', function(e){ console.error(e); });

/* ---------------- STATE ---------------- */
const DOW_LABELS = ['MON','TUE','WED','THU','FRI','SAT','SUN'];
const MONTH_LABELS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const COLORS = {
  olive:  getComputedColor('--olive'),
  yellow: getComputedColor('--yellow'),
  orange: getComputedColor('--orange'),
  bone:   getComputedColor('--bone'),
  red:    getComputedColor('--stamp-red')
};
function getComputedColor(v){
  return getComputedStyle(document.documentElement).getPropertyValue(v).trim();
}

let state = { recurring: [], extra: {}, weekTitles: {}, programVersion: 0, logs: {}, weight: {current:'', goal:''}, cycleStart: null, originCycleStart: null, nutritionMeals: [], nutritionLog: {}, nutritionGoals: {calories:'', protein:'', carbs:'', fats:''}, nutritionPhase: '', nutritionPlans: [], weightLog: {} };
let viewMode = 7;
let anchor = stripTime(new Date());
let pendingAdd = null;
let pendingLog = null;
let activeTab = 'dashboard';
let nutritionAnchor = stripTime(new Date());
let weightAnchor = stripTime(new Date());
let pendingValueField = null; // 'current' | 'goal', for weight editor
let dashCycleStart = null; // Date (Monday) for the 4-week window currently shown on the dashboard

const STORAGE_KEY = 'training-planner-data';
const COMP_DATE = new Date(2026, 9, 18); // Pan Pacifics No-Gi, Melbourne — Oct 18, 2026

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

/* ---------------- STORAGE ----------------
   Real browser localStorage — works standalone on GitHub Pages / any static host,
   no external bridge or account needed. Persists per browser+device. */
let storageOk = true;
function setStorageStatus(ok){
  storageOk = ok;
  const badge = document.getElementById('syncBadge');
  if(badge){
    badge.textContent = ok ? 'SAVED LOCALLY' : 'STORAGE BLOCKED';
    badge.style.color = ok ? 'var(--olive)' : 'var(--stamp-red)';
  }
  const gBadge = document.getElementById('globalSyncBadge');
  if(gBadge){
    gBadge.textContent = ok ? 'SAVED' : 'NOT SAVING';
    gBadge.classList.toggle('down', !ok);
  }
}
async function storageGetSafe(key){
  try{
    const raw = localStorage.getItem(key);
    setStorageStatus(true);
    return raw===null ? null : { key, value: raw, shared:false };
  }catch(e){
    // localStorage can throw in private/incognito modes with strict settings, or if disabled
    setStorageStatus(false);
    return null;
  }
}
async function storageSetSafe(key, value){
  try{
    localStorage.setItem(key, value);
    setStorageStatus(true);
    return { key, value, shared:false };
  }catch(e){
    setStorageStatus(false);
    return null;
  }
}

function stripTime(d){ const n = new Date(d); n.setHours(0,0,0,0); return n; }
function fmtKey(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function dowIndex(d){ return (d.getDay()+6)%7; }
function addDays(d,n){ const nd=new Date(d); nd.setDate(nd.getDate()+n); return nd; }
function mondayOf(d){ return addDays(d, -dowIndex(d)); }
function sameDate(a,b){ return fmtKey(a)===fmtKey(b); }
function fmtTime(t){
  if(!t) return '';
  let [h,m] = t.split(':').map(Number);
  const ap = h>=12?'PM':'AM';
  h = h%12; if(h===0) h=12;
  return `${h}:${String(m).padStart(2,'0')}${ap}`;
}

/* ---------------- SEEDED DEFAULT SESSIONS ---------------- */
function defaultRecurring(){
  const id = ()=> 'seed-'+Math.random().toString(36).slice(2,9);
  return [
    {id:id(), dow:1, time:'12:00', title:'No-Gi BJJ', location:'Costa', category:'bjj', color:'yellow', exercises:[]},
    {id:id(), dow:3, time:'12:00', title:'No-Gi BJJ', location:'Costa', category:'bjj', color:'yellow', exercises:[]},
    {id:id(), dow:5, time:'10:00', title:'Open Mats', location:'', category:'bjj', color:'yellow', exercises:[]},
  ];
}

/* Week-specific S&C programs — applied as dated (one-off) sessions, not indefinite recurring,
   since each training block has its own program. */
function addDatedSC(startMonday, offset, title, exercises){
  const date = addDays(startMonday, offset);
  const key = fmtKey(date);
  if(!state.extra[key]) state.extra[key] = [];
  state.extra[key].push({
    id: 'prog-'+Math.random().toString(36).slice(2,9),
    time:'', title, location:'', category:'sc', color:'olive', exercises
  });
}

function applyRebuildWeek2(startMonday){
  const session1 = [
    {name:'Back Squat', detail:'Superset w/ Lat Pulldown'},
    {name:'Lat Pulldown', detail:'Superset w/ Back Squat'},
    {name:'Walking Lunge', detail:'Superset w/ SA Fat Grip Pulldown'},
    {name:'Single Arm Fat Grip Pulldown', detail:'Superset w/ Walking Lunge'},
  ];
  const session2 = [
    {name:'Bench Press', detail:'Superset w/ Usmar Row'},
    {name:'Usmar Row', detail:'Superset w/ Bench Press'},
    {name:'Dips', detail:'Superset w/ Prime Row'},
    {name:'Prime Row', detail:'Superset w/ Dips'},
  ];
  const session3 = [
    {name:'Deadlift', detail:'Superset w/ Strict Press'},
    {name:'Strict Press', detail:'Superset w/ Deadlift'},
    {name:'Curl', detail:'Superset w/ Shoulder Raise'},
    {name:'Shoulder Raise', detail:'Superset w/ Curl'},
  ];
  addDatedSC(startMonday, 0, 'Session 1', session1); // Mon
  addDatedSC(startMonday, 1, 'Session 2', session2); // Tue
  addDatedSC(startMonday, 2, 'Session 3', session3); // Wed
  addDatedSC(startMonday, 3, 'Session 1', session1); // Thu (repeat)
  addDatedSC(startMonday, 4, 'Session 2', session2); // Fri (repeat)
  addDatedSC(startMonday, 5, 'Session 3', session3); // Sat (repeat)
}

function applyPerformanceWeek1(startMonday){
  addDatedSC(startMonday, 0, 'Power & Squat', [
    {name:'Power Snatch', detail:''},
    {name:'Back Squat', detail:'Superset w/ Jump Squats'},
    {name:'Jump Squats', detail:'Superset w/ Back Squat'},
    {name:'Walking Lunge', detail:''},
    {name:'Hip Flexor March', detail:''},
  ]);
  addDatedSC(startMonday, 1, 'Push / Pull', [
    {name:'Bench Press', detail:'Superset w/ Usmar Row'},
    {name:'Usmar Row', detail:'Superset w/ Bench Press'},
    {name:'Dips', detail:'Superset w/ Prone Row'},
    {name:'Prone Row', detail:'Superset w/ Dips'},
  ]);
  addDatedSC(startMonday, 2, 'Oly & Deadlift', [
    {name:'Jerk From Block', detail:''},
    {name:'Deadlift', detail:'Superset w/ Consecutive Broad Jump'},
    {name:'Consecutive Broad Jump', detail:'Superset w/ Deadlift'},
    {name:'Leg Curl', detail:''},
    {name:'Hip Abduction', detail:''},
  ]);
  addDatedSC(startMonday, 3, 'Upper Push/Pull', [
    {name:'Shoulder Press', detail:'Superset w/ Lat Pulldown'},
    {name:'Lat Pulldown', detail:'Superset w/ Shoulder Press'},
    {name:'Arnold Press', detail:'Superset w/ Single Arm Pulldown'},
    {name:'Single Arm Pulldown', detail:'Superset w/ Arnold Press'},
  ]);
  addDatedSC(startMonday, 4, 'Power Clean & Grip', [
    {name:'Hang Power Clean', detail:''},
    {name:'Farmers Carries', detail:''},
    {name:'Rope Pulls', detail:''},
    {name:'Wrist and Grip Twist', detail:''},
  ]);
  addDatedSC(startMonday, 5, 'Arm Blast', [
    {name:'Arm Blast', detail:''},
  ]);
}

/* ---------------- REAL PERFORMANCE PROGRAM (from Ant_Usmar_Performance_Program.xlsx) ----------------
   Rolling 4-week cycle, repeats indefinitely:
   Wk1 Triples / Wk2 Doubles / Wk3 Singles / Wk4 Deload. Starts the Monday it's applied from. */
const PROGRAM_CYCLE = [
  { label:'PERFORMANCE — TRIPLES (WK1)', main:{p:'5x3', r:'RPE 7-8'}, b:{p:'4x5-6', r:'RPE 7-8'}, c:{p:'3x8-10', r:'RPE 6-7'} },
  { label:'PERFORMANCE — DOUBLES (WK2)', main:{p:'5x2', r:'RPE 7-8'}, b:{p:'4x3', r:'RPE 7-8'}, c:{p:'3x8-10', r:'RPE 6-7'} },
  { label:'PERFORMANCE — SINGLES (WK3)', main:{p:'6x1', r:'RPE 7-8'}, b:{p:'4x2', r:'RPE 7-8'}, c:{p:'3x8-10', r:'RPE 6-7'} },
  { label:'PERFORMANCE — DELOAD (WK4)', main:{p:'4x2 (light)', r:'RPE 5-6'}, b:{p:'3x5-6 (light)', r:'RPE 5-6'}, c:{p:'2-3x8-10 (light)', r:'RPE 5'} },
];
const PROGRAM_DAYS = {
  mon: { title:'Snatch + Squat/Jump Superset', items:[
    {name:'Hang Power Snatch', tier:'main'},
    {name:'Back Squat', tier:'b', partner:'High Bar Heavy Jumps'},
    {name:'High Bar Heavy Jumps', tier:'b', partner:'Back Squat'},
    {name:'Dumbbell Walking Lunge', tier:'c', partner:'Isolateral Leg Curl'},
    {name:'Isolateral Leg Curl', tier:'c', partner:'Dumbbell Walking Lunge'},
  ]},

function applyPerformanceRollingProgram(startMonday, cycles){
  const dayOrder = ['mon','tue','wed','thu','fri','sat'];
  for(let w=0; w<cycles*4; w++){
    const weekStart = addDays(startMonday, w*7);
    const cyc = PROGRAM_CYCLE[w%4];
    state.weekTitles[fmtKey(weekStart)] = cyc.label;
    dayOrder.forEach((key, offset)=>{
      const day = PROGRAM_DAYS[key];
      const exercises = day.items.map(item=>{
        const t = cyc[item.tier];
        let detail = `${t.p} \u00b7 ${t.r}`;
        if(item.chain) detail = `${item.chain} \u00b7 ${detail}`;
        if(item.partner) detail += ` \u00b7 Superset w/ ${item.partner}`;
        return {name:item.name, detail};
      });
      addDatedSC(weekStart, offset, day.title, exercises);
    });
  }
}

/* ---------------- STORAGE LOAD/SAVE ---------------- */
async function loadState(){
  const res = await storageGetSafe(STORAGE_KEY);
  if(res && res.value){
    try{
      const parsed = JSON.parse(res.value);
      state = {
        recurring: parsed.recurring || [],
        extra: parsed.extra || {},
        weekTitles: parsed.weekTitles || {},
        programVersion: parsed.programVersion || 0,
        logs: parsed.logs || {},
        weight: parsed.weight || {current:'', goal:''},
        cycleStart: parsed.cycleStart || null,
        originCycleStart: parsed.originCycleStart || null,
        nutritionMeals: parsed.nutritionMeals || [],
        nutritionLog: parsed.nutritionLog || {},
        nutritionGoals: parsed.nutritionGoals || {calories:'', protein:'', carbs:'', fats:''},
        nutritionPhase: parsed.nutritionPhase || '',
        nutritionPlans: parsed.nutritionPlans || [],
        weightLog: parsed.weightLog || {}
      };
    }catch(e){
      state = { recurring: defaultRecurring(), extra: {}, weekTitles: {}, programVersion: 0, logs: {}, weight:{current:'',goal:''}, cycleStart:null, originCycleStart:null, nutritionMeals:[], nutritionLog:{}, nutritionGoals:{calories:'',protein:'',carbs:'',fats:''}, nutritionPhase:'', nutritionPlans:[], weightLog:{} };
    }
  } else {
    state = { recurring: defaultRecurring(), extra: {}, weekTitles: {}, programVersion: 0, logs: {}, weight:{current:'',goal:''}, cycleStart:null, originCycleStart:null, nutritionMeals:[], nutritionLog:{}, nutritionGoals:{calories:'',protein:'',carbs:'',fats:''}, nutritionPhase:'', nutritionPlans:[], weightLog:{} };
  }

  // one-time migration v2->v3: move S&C off indefinite recurring onto dated, block-specific programs
  if(state.programVersion < 3){
    // strip out any S&C recurring entries (block programs shouldn't repeat forever)
    state.recurring = state.recurring.filter(s=>s.category!=='sc');

    const thisMonday = mondayOf(stripTime(new Date()));
    const nextMonday = addDays(thisMonday, 7);
    const monAfter = addDays(nextMonday, 7);

    if(!state.weekTitles[fmtKey(nextMonday)]) state.weekTitles[fmtKey(nextMonday)] = 'REBUILD WEEK 2';
    if(!state.weekTitles[fmtKey(monAfter)]) state.weekTitles[fmtKey(monAfter)] = 'PERFORMANCE WEEK 1';

    applyRebuildWeek2(nextMonday);
    applyPerformanceWeek1(monAfter);

    state.programVersion = 3;
  }

  // one-time migration v3->v4: replace the guessed Performance Week block with the real
  // program from Ant_Usmar_Performance_Program.xlsx — a rolling 4-week cycle starting the
  // Monday it's applied from.
  if(state.programVersion < 4){
    const startMonday = addDays(mondayOf(stripTime(new Date())), 7); // next Monday from today
    const startKey = fmtKey(startMonday);
    Object.keys(state.extra).forEach(key=>{
      if(key >= startKey){
        state.extra[key] = (state.extra[key]||[]).filter(s=>s.category!=='sc');
        if(state.extra[key].length===0) delete state.extra[key];
      }
    });
    applyPerformanceRollingProgram(startMonday, 2); // 2 cycles = 8 weeks, carries past the comp date
    state.programVersion = 4;
  }

  // one-time migration v4->v5: dashboard 4-week cycle anchor + default nutrition plan
  if(state.programVersion < 5){
    state.cycleStart = fmtKey(mondayOf(stripTime(new Date())));
    state.nutritionMeals = defaultNutritionMeals();
    state.programVersion = 5;
  }

  // one-time migration v5->v6: fixed origin point for counting completed cycles historically,
  // independent of whatever cycle the dashboard happens to be viewing/set to right now.
  if(state.programVersion < 6){
    state.originCycleStart = state.cycleStart || fmtKey(mondayOf(stripTime(new Date())));
    state.programVersion = 6;
  }

  // one-time migration v6->v7: nutrition goals + phase title
  if(state.programVersion < 7){
    state.nutritionGoals = state.nutritionGoals || {calories:'', protein:'', carbs:'', fats:''};
    state.nutritionPhase = state.nutritionPhase || '';
    state.programVersion = 7;
  }

  // one-time migration v7->v8: real nutrition plan from Nutrition_Plan_Cycle1_Week1.pdf
  if(state.programVersion < 8){
    const id = ()=> 'nut-'+Math.random().toString(36).slice(2,9);
    const coreMeals = ()=> [
      {id:id(), name:'Cottage Cheese & Ghost Protein Oats', detail:'Sweetened + crunch', kcal:712, protein:50, fat:10, carb:106},
      {id:id(), name:'Jumbo Skim Coffee', detail:'Takeaway, large', kcal:165, protein:16, fat:0, carb:24},
      {id:id(), name:'Beef Bulgogi Rice Bowl', detail:'250g mince/serve', kcal:735, protein:63, fat:18, carb:73},
      {id:id(), name:'Smashed Burger & Air-Fried Fries', detail:'300g potato', kcal:917, protein:74, fat:22, carb:101},
      {id:id(), name:'Pre-Training Banana Bread', detail:'1 slice', kcal:280, protein:4, fat:11, carb:42},
    ];
    const sundayNote = 'FAST DAY — no structured meals. Fasted until evening, then one cheat meal at night, eaten freely and not tracked against the daily target.';

    state.nutritionPlans = [
      {
        id:id(), label:'Cycle 1 — Wk1-4 (Triples\u2192Doubles\u2192Singles\u2192Deload)',
        startDate:'2026-08-31', endDate:'2026-09-27',
        targetKcal:2800, targetProtein:'200+',
        meals: coreMeals(),
        sundayNote
      },
      {
        id:id(), label:'Cycle 2 — Wk5-7 (Triples/Doubles/Singles, deload TBD)',
        startDate:'2026-09-28', endDate:'2026-10-18',
        targetKcal:2950, targetProtein:'200+',
        meals: [
          ...coreMeals(),
          {id:id(), name:'Bulla Choc Bar', detail:'Vanilla, after dinner', kcal:176, protein:2, fat:10, carb:19, swaps:[
            {name:'FroPro Tub', detail:'per 100g \u2014 higher protein option', kcal:121, protein:10, fat:null, carb:null},
            {name:'Lindt 70% Dark Chocolate', detail:'per 25g \u2014 lower kcal option', kcal:158, protein:null, fat:null, carb:null},
          ]},
        ],
        sundayNote
      },
    ];
    state.programVersion = 8;
  }

  // one-time migration v8->v9: goal calories/macros set from the Cycle 1 target (2,800 kcal /
  // 200g+ protein floor, 62g fat / 345g carb as the itemised daily total).
  if(state.programVersion < 9){
    state.nutritionGoals = { calories:2800, protein:200, carbs:345, fats:62 };
    state.programVersion = 9;
  }

  await saveState();
  renderActivePage();
}

}

function cycleDates(){
  if(!dashCycleStart){
    dashCycleStart = state.cycleStart ? new Date(state.cycleStart+'T00:00:00') : mondayOf(stripTime(new Date()));
  }
  return Array.from({length:28}, (_,i)=>addDays(dashCycleStart,i));
}
function dotStatusFor(date, sessionId, category){
  const today = stripTime(new Date());
  if(date > today) return 'grey';
  const log = getLog(date, sessionId);
  if(date.getTime()===today.getTime()){
    if(log && !log.missed) return 'green';
    if(log && log.missed) return 'red';
    return 'pending';
  }
  if(log && !log.missed) return 'green';
  return 'red';
}
/* ---------------- WEIGHT LOG ---------------- */
function getLatestWeightEntry(){
  const today = fmtKey(stripTime(new Date()));
  const keys = Object.keys(state.weightLog).filter(k=> k<=today && state.weightLog[k] && state.weightLog[k].weight).sort();
  if(keys.length===0) return null;
  const latestKey = keys[keys.length-1];
  return { date: latestKey, weight: parseFloat(state.weightLog[latestKey].weight) };
}
function getAvgWeight(days){
  const today = stripTime(new Date());
  let sum=0, count=0;
  for(let i=0;i<days;i++){
    const k = fmtKey(addDays(today,-i));
    const entry = state.weightLog[k];
    if(entry && entry.weight){ sum += parseFloat(entry.weight); count++; }
  }
  return count>0 ? sum/count : null;
}

function nutritionStatusFor(date){
  const today = stripTime(new Date());
  const plan = getActivePlan(date);
  // Sunday is a fast day within a dated plan — nothing to check off, counts as done once it arrives
  if(plan.sundayNote && dowIndex(date)===6){
    return date > today ? 'grey' : 'green';
  }
  const key = fmtKey(date);
  const dayLog = state.nutritionLog[key] || {};
  const meals = plan.meals;
  const allChecked = meals.length>0 && meals.every(m=>dayLog[m.id]);
  if(date > today) return 'grey';
  if(date.getTime()===today.getTime()) return allChecked ? 'green' : 'pending';
  return allChecked ? 'green' : 'red';
}
function computeStreak(){
  let d = stripTime(new Date());
  const isDayComplete = (day)=>{
    const sess = [...sessionsFor(day).sc, ...sessionsFor(day).bjj];
    if(sess.length===0) return null; // no sessions scheduled that day
    return sess.every(s=>{ const l = getLog(day, s.id); return l && !l.missed; });
  };
  const todayStatus = isDayComplete(d);
  if(todayStatus !== true) d = addDays(d, -1);
  let streak = 0;
  while(true){
    const status = isDayComplete(d);
    if(status===null){ d = addDays(d,-1); continue; } // skip rest days, don't break streak
    if(status===false) break;
    streak++;
    d = addDays(d,-1);
    if(streak > 90) break; // safety cap
  }
  return streak;
}
function getCompletedCyclesStats(){
  const origin = state.originCycleStart ? new Date(state.originCycleStart+'T00:00:00') : mondayOf(stripTime(new Date()));
  const today = stripTime(new Date());
  const daysElapsed = Math.floor((today - origin) / 86400000);
  const completedCycles = Math.floor(daysElapsed / 28);
  if(completedCycles <= 0) return { count: 0, avg: null };
  let sumPct = 0;
  for(let c=0; c<completedCycles; c++){
    const cStart = addDays(origin, c*28);
    const cDates = Array.from({length:28}, (_,i)=>addDays(cStart,i));
    let done = 0, total = 0;
    cDates.forEach(d=>{
      const s = sessionsFor(d);
      s.sc.forEach(sess=>{ total++; if(dotStatusFor(d,sess.id,'sc')==='green') done++; });
      s.bjj.forEach(sess=>{ total++; if(dotStatusFor(d,sess.id,'bjj')==='green') done++; });
      total++; if(nutritionStatusFor(d)==='green') done++;
    });
    sumPct += total>0 ? (done/total*100) : 0;
  }
  return { count: completedCycles, avg: Math.round(sumPct/completedCycles) };
}

      <div class="sc-head"><span class="sc-title">Strength Work</span><span class="sc-count">${strengthDone}/${strengthDots.length||24}</span></div>
      <div class="dot-grid">${dotGrid(strengthDots, x=>dotStatusFor(x.date,x.id,'sc'))}</div>
    </div>

    <div class="section-card" id="dashBjjCard">
      <div class="sc-head"><span class="sc-title">BJJ Sessions</span><span class="sc-count">${bjjDone}/${bjjDots.length||12}</span></div>
      <div class="dot-grid">${dotGrid(bjjDots, x=>dotStatusFor(x.date,x.id,'bjj'))}</div>
    </div>

    <div class="section-card" id="dashNutCard">
      <div class="sc-head"><span class="sc-title">Daily Nutrition</span><span class="sc-count">${nutDone}/28</span></div>
      <div class="dot-grid">${dotGrid(dates, d=>nutritionStatusFor(d))}</div>
    </div>

    <div class="today-card" style="cursor:default;">
      <div class="today-card-title">BACKUP \u2014 KEEP YOUR DATA SAFE</div>
      <div class="tr-empty" style="text-align:left; padding:0 0 10px;">Your data saves to this browser only \u2014 it won't appear on a different phone or browser automatically. Export a backup now and then to keep a copy safe, and use Import if you ever switch devices or clear your browser data.</div>
      <div style="display:flex; gap:8px;">
        <button class="save-btn" id="exportBtn" style="flex:1;">Export Backup</button>
        <button class="save-btn" id="importBtn" style="flex:1; background:transparent; border:1px solid var(--line); color:var(--bone-dim);">Import Backup</button>
      </div>
      <textarea id="backupArea" style="display:none; width:100%; margin-top:10px; background:var(--panel-2); border:1px solid var(--line); border-radius:6px; color:var(--bone); font-family:'IBM Plex Mono',monospace; font-size:10px; padding:8px; height:120px;" placeholder="Paste a previously exported backup here, then tap Restore."></textarea>
      <button class="save-btn" id="restoreBtn" style="display:none; margin-top:8px; background:var(--stamp-red);">Restore This Backup</button>
    </div>
  `;

  document.getElementById('exportBtn').onclick = ()=>{
    const json = JSON.stringify(state, null, 2);
    const area = document.getElementById('backupArea');
    area.style.display = 'block';
    area.value = json;
    area.readOnly = true;
    document.getElementById('restoreBtn').style.display = 'none';
    try{
      const blob = new Blob([json], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `standing-orders-backup-${fmtKey(stripTime(new Date()))}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 2000);
    }catch(e){
      // download blocked in this context — the visible textarea above is the fallback, copy from there
    }
  };
  document.getElementById('importBtn').onclick = ()=>{
    const area = document.getElementById('backupArea');
    area.style.display = 'block';
    area.readOnly = false;
    area.value = '';
    area.placeholder = 'Paste a previously exported backup here, then tap Restore.';
    document.getElementById('restoreBtn').style.display = 'block';
  };
  document.getElementById('restoreBtn').onclick = async ()=>{
    const text = document.getElementById('backupArea').value.trim();
    if(!text) return;
    try{
      const parsed = JSON.parse(text);
      state = {
        recurring: parsed.recurring || [],
        extra: parsed.extra || {},
        weekTitles: parsed.weekTitles || {},
        programVersion: parsed.programVersion || 0,
        logs: parsed.logs || {},
        weight: parsed.weight || {current:'',goal:''},
        cycleStart: parsed.cycleStart || null,
        originCycleStart: parsed.originCycleStart || null,
        nutritionMeals: parsed.nutritionMeals || [],
        nutritionLog: parsed.nutritionLog || {},
        nutritionGoals: parsed.nutritionGoals || {calories:'',protein:'',carbs:'',fats:''},
        nutritionPhase: parsed.nutritionPhase || '',
        nutritionPlans: parsed.nutritionPlans || [],
        weightLog: parsed.weightLog || {}
      };
      await saveState();
      await loadState(); // re-applies any migrations this backup predates, then re-renders
    }catch(e){
      alert('That did not look like a valid backup file — check you copied the whole thing.');
    }
  };

  page.querySelectorAll('.done-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const sess = [...todaySc, ...todayBjj].find(s=>s.id===btn.dataset.id);
      if(sess) openLogSheet(today, sess);
    };
  });
  page.querySelectorAll('.miss-btn').forEach(btn=>{
    btn.onclick = async ()=>{
      const sess = [...todaySc, ...todayBjj].find(s=>s.id===btn.dataset.id);
      if(sess){
        await saveLog(today, sess.id, { type:sess.category, missed:true, loggedAt:new Date().toISOString() });
        renderDashboard();
      }
    };
  });
  document.getElementById('editGoalWeight').onclick = ()=> openValueEditor('Goal Weight (kg)', wGoal, async(v)=>{ state.weight.goal=v; await saveState(); renderDashboard(); });
  document.getElementById('cyclePrev').onclick = ()=>{ dashCycleStart = addDays(dashCycleStart, -28); renderDashboard(); };
  document.getElementById('cycleNext').onclick = ()=>{ dashCycleStart = addDays(dashCycleStart, 28); renderDashboard(); };
  document.getElementById('cycleThis').onclick = async ()=>{
    dashCycleStart = mondayOf(stripTime(new Date()));
    state.cycleStart = fmtKey(dashCycleStart);
    await saveState();
    renderDashboard();
  };
  document.getElementById('cycleSetDate').onclick = ()=>{
    openDateEditor('Cycle Start Date', fmtKey(dashCycleStart), async(v)=>{
      if(!v) return;
      dashCycleStart = new Date(v+'T00:00:00');
      state.cycleStart = v;
      await saveState();
      renderDashboard();
    });
  };
  document.getElementById('dashStrengthCard').onclick = (e)=>{ if(e.target.closest('button')) return; switchTab('calendar'); };
  document.getElementById('dashBjjCard').onclick = (e)=>{ if(e.target.closest('button')) return; switchTab('calendar'); };
  document.getElementById('dashNutCard').onclick = (e)=>{ if(e.target.closest('button')) return; switchTab('nutrition'); };
}

/* ---------------- NUTRITION PAGE ---------------- */
function renderNutrition(){
  const date = nutritionAnchor;
  const key = fmtKey(date);
  const dayLog = state.nutritionLog[key] || {};
  const plan = getActivePlan(date);
  const isFastDay = plan.sundayNote && dowIndex(date)===6;
  const meals = isFastDay ? [] : plan.meals;
  const today = stripTime(new Date());

  let totalKcal=0, totalProtein=0, totalFat=0, totalCarb=0, eatenKcal=0, eatenProtein=0, eatenFat=0, eatenCarb=0;
  meals.forEach(m=>{
    totalKcal += m.kcal||0; totalProtein += m.protein||0; totalFat += m.fat||0; totalCarb += m.carb||0;
    if(dayLog[m.id]){ eatenKcal += m.kcal||0; eatenProtein += m.protein||0; eatenFat += m.fat||0; eatenCarb += m.carb||0; }
  });

  // Full weekday macro totals for this plan (used for auto-goals even on a fast day, when `meals` above is empty)
  const usingDatedPlan = !plan.isFallback;
  let planKcal=0, planProtein=0, planFat=0, planCarb=0;
  (plan.meals||[]).forEach(m=>{ planKcal+=m.kcal||0; planProtein+=m.protein||0; planFat+=m.fat||0; planCarb+=m.carb||0; });

  const macroLine = (m) => [
    `${m.kcal} KCAL`,
    (m.protein!=null?`${m.protein}P`:null),
    (m.fat!=null?`${m.fat}F`:null),
    (m.carb!=null?`${m.carb}C`:null),
  ].filter(Boolean).join(' \u00b7 ');

  const mealsHtml = isFastDay ? '' : meals.map(m=>{
    const checked = !!dayLog[m.id];
    const swapsHtml = (m.swaps && m.swaps.length) ? `
      <div class="meal-detail" style="margin-top:6px; padding-top:5px; border-top:1px dashed var(--line-soft); color:var(--orange);">SWAP OPTIONS</div>
      ${m.swaps.map(sw=>`<div class="meal-macro" style="color:var(--orange);">${escapeHtml(sw.name)} (${escapeHtml(sw.detail)}) \u2014 ${macroLine(sw)}</div>`).join('')}
    ` : '';
    return `
      <div class="meal-card">
        <button class="meal-check ${checked?'checked':''}" data-id="${m.id}">${checked?'\u2713':''}</button>
        <div class="meal-info">
          <div class="meal-name ${checked?'eaten':''}">${escapeHtml(m.name)}</div>
          <div class="meal-detail">${escapeHtml(m.detail)}</div>
          <div class="meal-macro">${macroLine(m)}</div>
          ${swapsHtml}
        </div>
      </div>
    `;
  }).join('');

  const fastDayHtml = isFastDay ? `
    <div style="background:var(--panel-2); border:1px solid var(--orange); border-radius:8px; padding:16px; text-align:center; margin-bottom:14px; max-width:100%;">
      <div style="font-family:'Oswald',sans-serif; font-weight:700; font-size:16px; color:var(--orange); text-transform:uppercase; margin-bottom:6px;">Fast Day</div>
      <div style="font-size:11px; color:var(--bone-dim); line-height:1.5;">${escapeHtml(plan.sundayNote)}</div>
    </div>
  ` : '';

  const page = document.getElementById('page-nutrition');
  const goals = state.nutritionGoals;
  // Auto-periodised: when a dated plan covers this day, goals come straight from that plan
  // and switch automatically as the calendar crosses into the next phase. Manual goals only
  // apply on dates outside any defined plan.
  const goalCalories = usingDatedPlan ? plan.targetKcal : goals.calories;
  const goalProteinDisplay = usingDatedPlan ? plan.targetProtein : goals.protein;
  const goalCarbsVal = usingDatedPlan ? planCarb : goals.carbs;
  const goalFatsVal = usingDatedPlan ? planFat : goals.fats;
  const goalLine = (goalCalories || goalProteinDisplay)
    ? `<div class="nut-total" style="border-color:var(--olive); color:var(--olive); margin-bottom:14px;">
        <span>GOAL: ${goalCalories || '—'} KCAL</span>
        <span>${goalProteinDisplay||'—'}P / ${goalCarbsVal||'—'}C / ${goalFatsVal||'—'}F</span>
      </div>` : '';
  const planLine = usingDatedPlan ? `<div class="dash-sub" style="color:var(--olive);">${escapeHtml(plan.label)} \u00b7 Target ${plan.targetKcal} kcal / ${plan.targetProtein}g protein</div>` : '';

  const phaseTitleInner = usingDatedPlan
    ? `<span class="wt-lbl">NUTRITION PHASE \u00b7 AUTO</span><span class="wt-text">${escapeHtml(plan.label)}</span>`
    : `<span class="wt-lbl">NUTRITION PHASE</span><span class="wt-text" id="phaseTitleText">${state.nutritionPhase || 'TAP TO SET PHASE'}</span>`;
  const phaseTitleTag = usingDatedPlan ? 'div' : 'button';

  page.innerHTML = `
    <div class="dash-h1">Nutrition</div>
    <div class="dash-sub">Daily meal plan \u2014 tap to check off as eaten</div>
    ${planLine}

    <${phaseTitleTag} class="week-title-box" id="phaseTitleBox" style="width:100%; margin-bottom:12px; margin-top:10px; ${usingDatedPlan?'cursor:default;':''}">
      ${phaseTitleInner}
    </${phaseTitleTag}>

    <div class="weight-card" style="margin-bottom:8px;">
      <${usingDatedPlan?'div':'button'} class="weight-box" id="editGoalCal">
        <div class="wb-lbl">GOAL CALORIES${usingDatedPlan?' \u00b7 AUTO':''}</div>
        <div class="wb-val">${goalCalories ? goalCalories : '—'}</div>
      </${usingDatedPlan?'div':'button'}>
      <${usingDatedPlan?'div':'button'} class="weight-box goal" id="editGoalProtein">
        <div class="wb-lbl">PROTEIN (G)${usingDatedPlan?' \u00b7 AUTO':''}</div>
        <div class="wb-val">${goalProteinDisplay ? goalProteinDisplay : '—'}</div>
      </${usingDatedPlan?'div':'button'}>
    </div>
    <div class="weight-card" style="margin-bottom:16px;">
      <${usingDatedPlan?'div':'button'} class="weight-box" id="editGoalCarbs">
        <div class="wb-lbl">CARBS (G)${usingDatedPlan?' \u00b7 AUTO':''}</div>
        <div class="wb-val">${goalCarbsVal ? goalCarbsVal : '—'}</div>
      </${usingDatedPlan?'div':'button'}>
      <${usingDatedPlan?'div':'button'} class="weight-box goal" id="editGoalFats">
        <div class="wb-lbl">FATS (G)${usingDatedPlan?' \u00b7 AUTO':''}</div>
        <div class="wb-val">${goalFatsVal ? goalFatsVal : '—'}</div>
      </${usingDatedPlan?'div':'button'}>
    </div>

    <div class="nut-nav">
      <button class="nav-btn" id="nutPrev">&#8249;</button>
      <div class="nut-date">${DOW_LABELS[dowIndex(date)]}, ${MONTH_LABELS[date.getMonth()]} ${date.getDate()}</div>
      <button class="nav-btn" id="nutNext">&#8250;</button>
      <button class="today-btn" id="nutToday">TODAY</button>
    </div>
    ${fastDayHtml}
    ${mealsHtml}
    ${!isFastDay ? `
    <div class="nut-total">
      <span>${eatenKcal} / ${totalKcal} KCAL</span>
      <span>${eatenProtein}P / ${eatenFat}F / ${eatenCarb}C</span>
    </div>` : ''}
    ${!isFastDay ? goalLine : ''}
  `;

  if(!usingDatedPlan){
    document.getElementById('phaseTitleBox').onclick = ()=>{
      openFieldEditor('Nutrition Phase', state.nutritionPhase, 'text', 'Save Phase', async(v)=>{
        state.nutritionPhase = v;
        await saveState();
        renderNutrition();
      });
    };
    document.getElementById('editGoalCal').onclick = ()=> openFieldEditor('Goal Calories (kcal)', goals.calories, 'number', 'Save', async(v)=>{ state.nutritionGoals.calories=v; await saveState(); renderNutrition(); });
    document.getElementById('editGoalProtein').onclick = ()=> openFieldEditor('Goal Protein (g)', goals.protein, 'number', 'Save', async(v)=>{ state.nutritionGoals.protein=v; await saveState(); renderNutrition(); });
    document.getElementById('editGoalCarbs').onclick = ()=> openFieldEditor('Goal Carbs (g)', goals.carbs, 'number', 'Save', async(v)=>{ state.nutritionGoals.carbs=v; await saveState(); renderNutrition(); });
    document.getElementById('editGoalFats').onclick = ()=> openFieldEditor('Goal Fats (g)', goals.fats, 'number', 'Save', async(v)=>{ state.nutritionGoals.fats=v; await saveState(); renderNutrition(); });
  }

  page.querySelectorAll('.meal-check').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.dataset.id;
      const k = fmtKey(nutritionAnchor);
      if(!state.nutritionLog[k]) state.nutritionLog[k] = {};
      state.nutritionLog[k][id] = !state.nutritionLog[k][id];
      await saveState();
      renderNutrition();
    };
  });
  document.getElementById('nutPrev').onclick = ()=>{ nutritionAnchor = addDays(nutritionAnchor,-1); renderNutrition(); };
  document.getElementById('nutNext').onclick = ()=>{ nutritionAnchor = addDays(nutritionAnchor,1); renderNutrition(); };
  document.getElementById('nutToday').onclick = ()=>{ nutritionAnchor = stripTime(new Date()); renderNutrition(); };
}

      <div class="nut-nav" style="margin-bottom:12px;">
        <button class="nav-btn" id="wPrev">&#8249;</button>
        <div class="nut-date" style="font-size:14px;">${MONTH_LABELS[date.getMonth()]} ${date.getDate()}</div>

function buildSection(date, category, label){
  const wrap = document.createElement('div');
  wrap.className = `section ${category}`;

  const head = document.createElement('div');
  head.className = 'section-head';
  head.innerHTML = `<span>${label}</span>`;
  const addBtn = document.createElement('button');
  addBtn.className = 'add-mini';
  addBtn.textContent = '+';
  addBtn.onclick = ()=> openSheet(date, category);
  head.appendChild(addBtn);
  wrap.appendChild(head);

  const list = document.createElement('div');
  list.className = 'card-list';
  const data = sessionsFor(date)[category];

  if(data.length===0){
    const hint = document.createElement('div');
    hint.className = 'empty-hint';
    hint.textContent = 'Nothing scheduled';
    list.appendChild(hint);
  } else {
    data.forEach(s=>{
      const card = document.createElement('div');
      card.className = 'card';
      card.style.borderLeftColor = COLORS[s.color] || COLORS[category==='sc'?'olive':'yellow'];
      const log = getLog(date, s.id);

      const exHtml = (s.exercises && s.exercises.length)
        ? `<div class="exlist">${s.exercises.map((ex,i)=>{
            const actual = log && log.exerciseActuals && log.exerciseActuals[i];
            return `<div class="exrow"><span class="exname">${escapeHtml(ex.name)}</span>${ex.detail?` — ${escapeHtml(ex.detail)}`:''}</div>`
              + (actual ? `<div class="exactual">&#8618; ${escapeHtml(actual)}</div>` : '');
          }).join('')}</div>`
        : '';

      let logStatsHtml = '';
      if(log){
        const parts = [];
        if(log.duration) parts.push(`${escapeHtml(log.duration)} MIN`);
        if(log.avgHr) parts.push(`${escapeHtml(log.avgHr)} BPM AVG`);
        if(log.calories) parts.push(`${escapeHtml(log.calories)} KCAL`);
        if(log.rounds) parts.push(`${escapeHtml(log.rounds)} RD`);
        if(parts.length) logStatsHtml = `<div class="logstats">${parts.join(' \u00b7 ')}</div>`;
        if(log.notes) logStatsHtml += `<div class="cloc">${escapeHtml(log.notes)}</div>`;
      }

      card.innerHTML = `
        <div class="card-top-row">
          ${s.time ? `<span class="ctime">${fmtTime(s.time)}</span>` : '<span></span>'}
          <span class="card-icons">
            ${s.locked ? '<span class="stamp">Standing</span>' : ''}
            ${log ? '<span class="logged-dot" title="Logged">&#10003;</span>' : ''}
            <button type="button" class="card-edit-btn" title="Edit">&#9998;</button>
          </span>
        </div>
        <div class="ctitle">${escapeHtml(s.title)}</div>
        ${s.location ? `<div class="cloc">${escapeHtml(s.location)}</div>` : ''}
        ${exHtml}
        ${logStatsHtml}
      `;
      card.querySelector('.card-edit-btn').onclick = (ev)=>{ ev.stopPropagation(); openSheetForEdit(date, s); };
      card.onclick = ()=> openLogSheet(date, s);
      list.appendChild(card);
    });
  }
  wrap.appendChild(list);
  return wrap;
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str||'';
  return d.innerHTML;
}

async function deleteSession(){
  if(!pendingAdd || pendingAdd.mode!=='edit') return;
  const { date, session } = pendingAdd;
  if(session.locked){
    state.recurring = state.recurring.filter(s=>s.id!==session.id);
  } else {
    const key = fmtKey(date);
    if(state.extra[key]){
      state.extra[key] = state.extra[key].filter(s=>s.id!==session.id);
      if(state.extra[key].length===0) delete state.extra[key];
    }
  }
  await saveState();
  closeSheet();
  render();
}

function addExerciseRow(name, detail){
  const container = document.getElementById('exerciseRows');
  const row = document.createElement('div');
  row.className = 'ex-row';
  row.innerHTML = `
    <input type="text" class="ex-name" placeholder="Exercise, e.g. Trap Bar Deadlift" value="${escapeAttr(name||'')}">
    <input type="text" class="ex-detail" placeholder="Sets x reps @ weight" value="${escapeAttr(detail||'')}">
    <button type="button" class="ex-remove">&times;</button>
  `;
  row.querySelector('.ex-remove').onclick = ()=> row.remove();
  container.appendChild(row);
}
function escapeAttr(str){
  return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
}
function collectExercises(){
  const rows = document.querySelectorAll('#exerciseRows .ex-row');
  const out = [];
  rows.forEach(r=>{
    const name = r.querySelector('.ex-name').value.trim();
    const detail = r.querySelector('.ex-detail').value.trim();
    if(name) out.push({name, detail});
  });
  return out;
}
document.getElementById('addExerciseBtn').onclick = ()=> addExerciseRow('','');

/* ---------------- ADD / EDIT SHEET ---------------- */
function openSheet(date, category){
  pendingAdd = { mode:'add', date, category };
  document.getElementById('sheetTitle').textContent = category==='sc' ? 'Add S&C Session' : 'Add BJJ Session';
  document.getElementById('fTitle').value = '';
  document.getElementById('fTime').value = '';
  document.getElementById('fLoc').value = '';
  document.getElementById('fRepeat').checked = false;
  buildColorRow(category==='sc' ? 'olive' : 'yellow');
  document.getElementById('exerciseSection').style.display = category==='sc' ? 'block' : 'none';
  if(category==='sc') renderExerciseRows([]);
  document.getElementById('saveBtn').textContent = 'Lock In Session';
  document.getElementById('deleteRow').style.display = 'none';
  document.getElementById('lockNote').textContent =
    `Adding to ${DOW_LABELS[dowIndex(date)]}, ${MONTH_LABELS[date.getMonth()]} ${date.getDate()}. Check "repeat weekly" to make it a standing order.`;
  document.getElementById('overlay').classList.add('open');
}
function openSheetForEdit(date, session){
  pendingAdd = { mode:'edit', date, category: session.category, session };
  document.getElementById('sheetTitle').textContent = 'Edit Session';
  document.getElementById('fTitle').value = session.title || '';
  document.getElementById('fTime').value = session.time || '';
  document.getElementById('fLoc').value = session.location || '';
  document.getElementById('fRepeat').checked = !!session.locked;
  buildColorRow(session.color || (session.category==='sc' ? 'olive' : 'yellow'));
  document.getElementById('exerciseSection').style.display = session.category==='sc' ? 'block' : 'none';
  if(session.category==='sc') renderExerciseRows(session.exercises || []);
  document.getElementById('saveBtn').textContent = 'Save Changes';
  document.getElementById('deleteRow').style.display = 'block';
  document.getElementById('lockNote').textContent =
    session.locked
      ? `Standing order on ${DOW_LABELS[session.dow]}s. Untick "repeat weekly" to make it a one-off on this date instead.`
      : `One-off session on ${DOW_LABELS[dowIndex(date)]}, ${MONTH_LABELS[date.getMonth()]} ${date.getDate()}. Tick "repeat weekly" to make it a standing order.`;
  document.getElementById('overlay').classList.add('open');
}
function closeSheet(){
  document.getElementById('overlay').classList.remove('open');
  pendingAdd = null;
}

/* ---------------- LOG SHEET ---------------- */
function openLogSheet(date, session){
  pendingLog = { date, session };
  document.getElementById('logSheetTitle').textContent = `Log: ${session.title}`;
  const body = document.getElementById('logBody');
  const existing = getLog(date, session.id);

  if(session.category==='sc'){
    body.innerHTML = `
      <div class="row2">
        <div class="field"><label>Duration (min)</label><input type="number" inputmode="numeric" id="logDuration" value="${escapeAttr((existing && existing.duration) || '')}"></div>
        <div class="field"><label>Avg HR (bpm)</label><input type="number" inputmode="numeric" id="logAvgHr" value="${escapeAttr((existing && existing.avgHr) || '')}"></div>
      </div>
      <div class="field"><label>Calories (kcal)</label><input type="number" inputmode="numeric" id="logCalories" value="${escapeAttr((existing && existing.calories) || '')}"></div>
    ` + (session.exercises||[]).map((ex,i)=>`
      <div class="log-ex-row">
        <div class="lex-name">${escapeHtml(ex.name)}</div>
        ${ex.detail ? `<div class="lex-prescribed">Rx: ${escapeHtml(ex.detail)}</div>` : ''}
        <input type="text" class="lex-actual" data-idx="${i}" placeholder="e.g. 140kg x3, 145x3, 150x3"
          value="${escapeAttr((existing && existing.exerciseActuals && existing.exerciseActuals[i]) || '')}">
      </div>
    `).join('') + `
      <div class="field">
        <label>Session Notes</label>
        <input type="text" id="logNotes" placeholder="How did it feel?" value="${escapeAttr((existing && existing.notes) || '')}">
      </div>
    `;
  } else {
    body.innerHTML = `
      <div class="row2">
        <div class="field"><label>Duration (min)</label><input type="number" inputmode="numeric" id="logDuration" value="${escapeAttr((existing && existing.duration) || '')}"></div>
        <div class="field"><label>Avg HR (bpm)</label><input type="number" inputmode="numeric" id="logAvgHr" value="${escapeAttr((existing && existing.avgHr) || '')}"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Calories (kcal)</label><input type="number" inputmode="numeric" id="logCalories" value="${escapeAttr((existing && existing.calories) || '')}"></div>
        <div class="field"><label>Rounds</label><input type="number" inputmode="numeric" id="logRounds" value="${escapeAttr((existing && existing.rounds) || '')}"></div>
      </div>
      <div class="field">
        <label>Notes</label>
        <input type="text" id="logNotes" placeholder="Techniques, sparring notes, how it felt" value="${escapeAttr((existing && existing.notes) || '')}">
      </div>
    `;
  }

  document.getElementById('logNote').textContent =
    `Logging ${DOW_LABELS[dowIndex(date)]}, ${MONTH_LABELS[date.getMonth()]} ${date.getDate()}. Pull duration / avg HR / calories off Polar Flow or the Polar Beat app after the session.`;
  document.getElementById('logOverlay').classList.add('open');
}
function closeLogSheet(){
  document.getElementById('logOverlay').classList.remove('open');
  pendingLog = null;
}
async function handleLogSave(){
  if(!pendingLog) return;
  const { date, session } = pendingLog;
  const logObj = { type: session.category, loggedAt: new Date().toISOString() };
  if(session.category==='sc'){
    const actuals = [];
    document.querySelectorAll('#logBody .lex-actual').forEach(inp=>{
      actuals[Number(inp.dataset.idx)] = inp.value.trim();
    });
    logObj.exerciseActuals = actuals;
    logObj.duration = document.getElementById('logDuration').value.trim();
    logObj.avgHr = document.getElementById('logAvgHr').value.trim();
    logObj.calories = document.getElementById('logCalories').value.trim();
    logObj.notes = document.getElementById('logNotes').value.trim();
  } else {
    logObj.duration = document.getElementById('logDuration').value.trim();
    logObj.avgHr = document.getElementById('logAvgHr').value.trim();
    logObj.calories = document.getElementById('logCalories').value.trim();
    logObj.rounds = document.getElementById('logRounds').value.trim();
    logObj.notes = document.getElementById('logNotes').value.trim();
  }
  await saveLog(date, session.id, logObj);
  closeLogSheet();
  renderActivePage();
}
function buildColorRow(selected){
  const row = document.getElementById('colorRow');
  row.innerHTML = '';
  row.dataset.selected = selected;
  Object.keys(COLORS).forEach(name=>{
    const sw = document.createElement('div');
    sw.className = 'color-swatch' + (name===selected?' sel':'');
    sw.style.background = COLORS[name];
    sw.dataset.name = name;
    sw.onclick = ()=>{
      row.dataset.selected = name;
      row.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('sel'));
      sw.classList.add('sel');
    };
    row.appendChild(sw);
  });
}

async function handleSave(){
  if(!pendingAdd) return;
  const title = document.getElementById('fTitle').value.trim();
  if(!title){ document.getElementById('fTitle').focus(); return; }
  const time = document.getElementById('fTime').value;
  const location = document.getElementById('fLoc').value.trim();
  const repeat = document.getElementById('fRepeat').checked;
  const color = document.getElementById('colorRow').dataset.selected;
  const { date, category, mode } = pendingAdd;
  const exercises = category==='sc' ? collectExercises() : [];

  if(mode==='edit'){
    const { session } = pendingAdd;
    if(session.locked){
      state.recurring = state.recurring.filter(s=>s.id!==session.id);
    } else {
      const key = fmtKey(date);
      if(state.extra[key]){
        state.extra[key] = state.extra[key].filter(s=>s.id!==session.id);
        if(state.extra[key].length===0) delete state.extra[key];
      }
    }
    if(repeat){
      state.recurring.push({ id: session.id, dow: dowIndex(date), time, title, location, category, color, exercises });
    } else {
      const key = fmtKey(date);
      if(!state.extra[key]) state.extra[key] = [];
      state.extra[key].push({ id: session.id, time, title, location, category, color, exercises });
    }
  } else {
    if(repeat){
      state.recurring.push({
        id: 'r-'+Date.now()+Math.random().toString(36).slice(2,6),
        dow: dowIndex(date), time, title, location, category, color, exercises
      });
    } else {
      const key = fmtKey(date);
      if(!state.extra[key]) state.extra[key] = [];
      state.extra[key].push({
        id: 'e-'+Date.now()+Math.random().toString(36).slice(2,6),
        time, title, location, category, color, exercises
      });
    }
  }
  await saveState();
  closeSheet();
  render();
}

/* ---------------- EVENTS ---------------- */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.onclick = ()=> switchTab(btn.dataset.tab);
});
document.getElementById('prevBtn').onclick = ()=>{ anchor = addDays(anchor, -viewMode); render(); };
document.getElementById('nextBtn').onclick = ()=>{ anchor = addDays(anchor, viewMode); render(); };
document.getElementById('todayBtn').onclick = ()=>{ anchor = stripTime(new Date()); render(); };
document.querySelectorAll('.view-btn').forEach(btn=>{
  btn.onclick = ()=>{ viewMode = Number(btn.dataset.mode); render(); };
});
document.getElementById('sheetClose').onclick = closeSheet;
document.getElementById('overlay').onclick = (e)=>{ if(e.target.id==='overlay') closeSheet(); };
document.getElementById('saveBtn').onclick = handleSave;
document.getElementById('deleteBtn').onclick = deleteSession;

document.getElementById('weekTitleBox').onclick = ()=>{
  openFieldEditor('Name This Week', getWeekTitle(anchor), 'text', 'Save Title', async(v)=>{
    await setWeekTitle(anchor, v);
    render();
  });
};
document.getElementById('titleSheetClose').onclick = resetFieldEditor;
document.getElementById('titleOverlay').onclick = (e)=>{
  if(e.target.id==='titleOverlay') resetFieldEditor();
};
document.getElementById('titleSaveBtn').onclick = defaultTitleSave;
async function defaultTitleSave(){
  const val = document.getElementById('fWeekTitle').value.trim();
  await setWeekTitle(anchor, val);
  resetFieldEditor();
  render();
}

document.getElementById('logSheetClose').onclick = closeLogSheet;
document.getElementById('logOverlay').onclick = (e)=>{ if(e.target.id==='logOverlay') closeLogSheet(); };
document.getElementById('logSaveBtn').onclick = handleLogSave;

loadState();
</script>
